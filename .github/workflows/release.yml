# Builds and publishes a signed Helm release when you push a tag such as v0.4.0.
# One-time setup: add the contents of keys/release.key as the repository secret HELM_RELEASE_KEY.
name: release
on:
  push:
    tags: ["v*"]
    branches: [main]   # every push to main is checked; a release is built only if VERSION names one that does not exist yet
  schedule:
    - cron: "*/15 * * * *"   # also checked every 15 minutes, in case a push did not start a run
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish from the selected branch, e.g. v0.4.1"
        required: true
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
env:
  TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if [ "${{ github.ref_type }}" = "branch" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            t="v$(tr -d '[:space:]' < VERSION)"
            if gh release view "$t" --repo "${{ github.repository }}" >/dev/null 2>&1; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  macos-pkg:
    needs: check
    if: needs.check.outputs.skip != 'true'
    # GitHub's macOS machines are sometimes all busy. Do not let that block the release: it goes out without the .pkg files.
    continue-on-error: true
    timeout-minutes: 25
    # The .pkg can only be built with Apple's pkgbuild, so a macOS runner does it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the release tag
        run: |
          [ -n "$TAG" ] || echo "TAG=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      - name: Build agent and package
        env:
          HELM_RELEASE_KEY: ${{ secrets.HELM_RELEASE_KEY }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p extra bin
          printf '%s\n' "$HELM_RELEASE_KEY" > "$RUNNER_TEMP/release.key"
          PUB=$(go run ./cmd/helm-sign pub -key "$RUNNER_TEMP/release.key" | tail -n1 | tr -d '[:space:]')
          rm -f "$RUNNER_TEMP/release.key"
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=$VERSION -X main.updatePubKey=$PUB" -o bin/helm-agent-darwin-$arch ./cmd/helm-agent
            installer/build-pkg.sh "$VERSION" bin/helm-agent-darwin-$arch $arch extra/Helm-Agent-macos-$arch.pkg
          done
      - uses: actions/upload-artifact@v4
        with: { name: macos-pkg, path: extra/*.pkg }
  build:
    needs: [check, macos-pkg]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Work out the release tag
        run: |
          [ -n "$TAG" ] || echo "TAG=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: macos-pkg, path: extra }
      - name: Test
        run: go vet ./... && go test ./...
      - name: Release signing key
        run: |
          mkdir -p keys
          printf '%s\n' "$HELM_RELEASE_KEY" > keys/release.key
          chmod 600 keys/release.key
        env:
          HELM_RELEASE_KEY: ${{ secrets.HELM_RELEASE_KEY }}
      - name: Install MSI tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq msitools wixl
      - name: Build
        run: ./build.sh "${TAG#v}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/relnotes.js "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" 2>/dev/null || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/release/* out/SHA256SUMS --clobber
          else
            gh release create "$TAG" out/release/* out/SHA256SUMS --title "Helm ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
